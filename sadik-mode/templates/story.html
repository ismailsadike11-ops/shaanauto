<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>Sadik Mode story</title>
<!-- Instagram story 1080x1920. Change PHOTO, PRICE, PRODUCT and PHONE below. -->
<style>@font-face{font-family:Cairo;font-weight:700;src:url(../fonts/Cairo-700.ttf)}@font-face{font-family:Cairo;font-weight:900;src:url(../fonts/Cairo-900.ttf)}@font-face{font-family:Amiri;font-weight:700;src:url(../fonts/Amiri-700.ttf)}@font-face{font-family:Montserrat;font-weight:600;src:url(../fonts/Montserrat-600.ttf)}
*{box-sizing:border-box}body{margin:0;width:1080px;height:1920px;font-family:Cairo;background:#1C1C1F;position:relative;overflow:hidden;color:#fff}
.logo{position:absolute;top:80px;left:50%;transform:translateX(-50%);height:380px}
.photo{position:absolute;top:520px;left:80px;right:80px;height:860px;border-radius:24px;background:#F6EFE6 center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:#a8987e;font-size:46px;font-weight:700;border:3px solid #D9A441}
.price{position:absolute;left:0;right:0;bottom:330px;text-align:center}.price span{background:#7A1530;border:4px solid #D9A441;border-radius:24px;padding:6px 50px;font-weight:900;font-size:66px}.price b{font-size:140px}
.prod{position:absolute;left:0;right:0;bottom:240px;text-align:center;font-size:52px;font-weight:700;color:#D9A441}
.wa{position:absolute;left:140px;right:140px;bottom:110px;height:100px;background:#1FAF38;border-radius:60px;display:flex;align-items:center;justify-content:center;font-family:Montserrat;font-weight:600;font-size:50px;direction:ltr}
</style></head><body>
<img class="logo" src="../logo/svg/sadik-mode-stacked-on-slate.svg">
<div class="photo" id="PHOTO">حط تصويرة السلعة هنا</div>
<div class="price"><span><b id="PRICE">35</b> درهم</span></div>
<div class="prod" id="PRODUCT">بيجامة رجالي · بيع فقط بالجملة</div>
<div class="wa">WhatsApp <span id="PHONE">&nbsp;06 00 00 00 00</span></div>
</body></html>
